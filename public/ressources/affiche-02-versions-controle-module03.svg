<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc"><title id="title">De la V1 à la V2 à relire</title><desc id="desc">Corriger réellement, tracer les changements, faire décider l’humain.</desc><rect width="1200" height="1800" fill="#081729"/><text x="72" y="78" fill="#e8c77f" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">LN-IA  /  MODULE 03</text><text x="1128" y="78" fill="#e8c77f" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="end">02 / 02</text><text x="72" y="160" fill="#f5f4ed" font-family="Segoe UI,Arial,sans-serif" font-size="49" font-weight="700" text-anchor="start">De la V1 à la V2 à relire</text><text x="72" y="216" fill="#c2cfdb" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">Corriger réellement, tracer les changements, faire décider l’humain.</text><polyline points="72,254 1128,254" fill="none" stroke="#e8c77f" stroke-width="2" stroke-linejoin="round"/><polyline points="600,430 600,490" fill="none" stroke="#e8c77f" stroke-width="3" stroke-linejoin="round"/><polygon points="600.0,490.0 594.3,478.3 605.7,478.3" fill="#e8c77f"/><polyline points="600,620 600,680" fill="none" stroke="#e8c77f" stroke-width="3" stroke-linejoin="round"/><polygon points="600.0,680.0 594.3,668.3 605.7,668.3" fill="#e8c77f"/><polyline points="600,790 600,870" fill="none" stroke="#e8c77f" stroke-width="3" stroke-linejoin="round"/><polygon points="600.0,870.0 594.3,858.3 605.7,858.3" fill="#e8c77f"/><polyline points="600,1090 600,1160" fill="none" stroke="#e8c77f" stroke-width="3" stroke-linejoin="round"/><polygon points="600.0,1160.0 594.3,1148.3 605.7,1148.3" fill="#e8c77f"/><polyline points="600,1260 600,1340" fill="none" stroke="#e8c77f" stroke-width="3" stroke-linejoin="round"/><polygon points="600.0,1340.0 594.3,1328.3 605.7,1328.3" fill="#e8c77f"/><polyline points="600,1460 600,1550" fill="none" stroke="#e8c77f" stroke-width="3" stroke-linejoin="round"/><polygon points="600.0,1550.0 594.3,1538.3 605.7,1538.3" fill="#e8c77f"/><polyline points="275,980 100,980 100,555 250,555" fill="none" stroke="#c2cfdb" stroke-width="3" stroke-linejoin="round"/><polygon points="250.0,555.0 238.3,560.7 238.3,549.3" fill="#c2cfdb"/><text x="100" y="1040" fill="#c2cfdb" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">NON</text><text x="100" y="1073" fill="#c2cfdb" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Reprendre</text><text x="100" y="1104" fill="#c2cfdb" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">la correction.</text><polyline points="950,1400 1100,1400 1100,555 950,555" fill="none" stroke="#c2cfdb" stroke-width="2" stroke-linejoin="round"/><polygon points="950.0,555.0 961.7,549.3 961.7,560.7" fill="#c2cfdb"/><text x="1090" y="1320" fill="#c2cfdb" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="end">À CORRIGER</text><rect x="250" y="320" width="700" height="110" rx="14" fill="#10253e" stroke="#e8c77f" stroke-width="2"/><text x="600" y="363" fill="#e8c77f" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">01  /  Exporter et conserver V1</text><text x="600" y="403" fill="#f5f4ed" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">Garder le fichier V1 comme référence.</text><rect x="250" y="490" width="700" height="130" rx="14" fill="#10253e" stroke="#e8c77f" stroke-width="2"/><text x="600" y="533" fill="#e8c77f" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">02  /  Relire et modifier le texte</text><text x="600" y="573" fill="#f5f4ed" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">Corriger les champs et vérifier les faits / consignes.</text><rect x="250" y="680" width="700" height="110" rx="14" fill="#10253e" stroke="#e8c77f" stroke-width="2"/><text x="600" y="723" fill="#e8c77f" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">03  /  Écrire le journal V1 → V2</text><text x="600" y="763" fill="#f5f4ed" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">Préciser le passage, le motif et la vérification.</text><rect x="250" y="1160" width="700" height="100" rx="14" fill="#10253e" stroke="#e8c77f" stroke-width="2"/><text x="600" y="1203" fill="#e8c77f" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">04  /  Exporter V2 À RELIRE</text><text x="600" y="1243" fill="#f5f4ed" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">Conserver V1, V2, journal et preuve S12.</text><rect x="250" y="1340" width="700" height="120" rx="14" fill="#10253e" stroke="#e8c77f" stroke-width="2"/><text x="600" y="1383" fill="#e8c77f" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">05  /  Revue humaine finale</text><text x="600" y="1423" fill="#f5f4ed" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">Cohérence · Faits · Utilité · Confidentialité</text><rect x="250" y="1550" width="700" height="105" rx="14" fill="#10253e" stroke="#e8c77f" stroke-width="2"/><text x="600" y="1593" fill="#e8c77f" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">06  /  Consigner la décision réelle</text><text x="600" y="1633" fill="#f5f4ed" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">Responsable · Date · Réserves · Statut · Autorisations</text><polygon points="600,870.0 925.0,980 600,1090.0 275.0,980" fill="#10253e" stroke="#e8c77f" stroke-width="2"/><text x="600" y="960" fill="#f5f4ed" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">V1 exportée + champs modifiés</text><text x="600" y="990" fill="#f5f4ed" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">Journal : au moins 12 caractères</text><text x="600" y="1022" fill="#f5f4ed" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">Relecture humaine déclarée ?</text><text x="630" y="1130" fill="#e8c77f" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">OUI</text><text x="600" y="1694" fill="#c2cfdb" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">L’export technique ne valide ni le contenu ni sa diffusion.</text><text x="72" y="1730" fill="#e8c77f" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">L’IA propose. L’humain pilote et contrôle.</text><text x="72" y="1770" fill="#c2cfdb" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Adaptation pédagogique • Automne 2026 • V1 À RELIRE</text></svg>